name: 2027 Admission Monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = 完整检查；test-email = 测试邮箱'
        type: choice
        options: [run, test-email]
        default: run
permissions:
  contents: write
concurrency:
  group: admission-monitor-state
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check time before dependency/network setup
        id: window
        run: |
          python scripts/window_gate.py >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.window.outputs.active == 'true'
        run: pip install -r requirements.txt
      - name: Restore durable state branch
        if: steps.window.outputs.active == 'true' && inputs.mode != 'test-email'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/prepare_state.py
      - name: Run monitor
        if: steps.window.outputs.active == 'true'
        env:
          EMAIL_HOST: ${{ secrets.EMAIL_HOST || 'smtp.gmail.com' }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT || '465' }}
          EMAIL_USER: ${{ secrets.EMAIL_USER || secrets.SMTP_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD || secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "test-email" ]; then
            python main.py --test-email
          else
            python main.py --run-once --git-state
          fi
      - name: Save reports even on partial failure
        if: always() && steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: monitor-report-${{ github.run_number }}
          path: logs/
          retention-days: 30
      - name: Publish health summary
        if: always() && steps.window.outputs.active == 'true'
        run: python scripts/action_summary.py >> "$GITHUB_STEP_SUMMARY"
